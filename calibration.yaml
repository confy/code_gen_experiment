groups:
  - &SystemVersion
    name: "SystemVersion"
    doc: "System version information"
    fields:
      - { name: "major", type: "float", doc: "Major version" }
      - { name: "minor", type: "float", doc: "Minor version" }
  - &FrownCal
    name: "FrownCal"
    doc: "Frown correction parameters"
    fields:
      - { name: "mapping", type: "float", size: 192, doc: "Frown correction map" }

ProductCalibration:
  - name: "ProductCalibration"
    doc: "Product specific calibration data"
    members:
      - *SystemVersion
      - *FrownCal